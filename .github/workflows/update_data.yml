name: Update hazard data

on:
  schedule:
    # Twice daily at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-process even if no new satellite or rainfall data was found"
        type: boolean
        default: false

permissions:
  contents: write   # push data commits
  pages: write      # ask GitHub Pages to rebuild after a data commit
  actions: write    # keep the scheduled workflow enabled (best effort)

# Never run two pipelines at once: they would push conflicting data commits.
concurrency:
  group: hazard-data-update
  cancel-in-progress: false

env:
  # Optional repository variable. When set (for example to "data") the layers are
  # published to that history-free branch instead of being committed to the
  # current branch, so the repository never grows. See README.md.
  DATA_BRANCH: ${{ vars.DATA_BRANCH }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache administrative boundaries
        uses: actions/cache@v4
        with:
          path: .cache
          key: admin-boundaries-v1-${{ github.run_id }}
          restore-keys: |
            admin-boundaries-v1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Restore previous state from the data branch
        if: ${{ env.DATA_BRANCH != '' }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            mkdir -p data
            git archive FETCH_HEAD | tar -x -C data
            echo "Restored previous layers from branch '$DATA_BRANCH'."
          else
            echo "Data branch '$DATA_BRANCH' does not exist yet; starting from the seed files."
          fi

      - name: Generate flood and landslide layers
        id: pipeline
        continue-on-error: true   # still commit metadata.json, then fail the job below
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT }}
          FORCE_REPROCESS: ${{ inputs.force && '1' || '0' }}
        run: python scripts/generate_hazard_data.py

      - name: Fetch river flood forecast (GloFAS)
        # Independent of Earth Engine: runs even when the satellite step failed.
        continue-on-error: true
        run: python scripts/fetch_river_forecast.py

      - name: Refresh weather, official-source bulletins, ENSO and earthquake feeds
        # This independent step refreshes forecast-based risk screening and source-backed links.
        # Each source keeps its last successful payload if a request fails.
        continue-on-error: true
        run: python scripts/fetch_public_info.py

      - name: Pull official DMH alerts from the weather website
        # Only runs when the repository variable WEATHER_API_BASE is set (for example https://your-weather-site.example).
        # If the request fails, the previous data/official_alerts.json is kept.
        if: ${{ vars.WEATHER_API_BASE != '' }}
        continue-on-error: true
        env:
          WEATHER_API_BASE: ${{ vars.WEATHER_API_BASE }}
        run: python scripts/import_weather_site_data.py --api-base "$WEATHER_API_BASE"

      - name: Fetch township rain forecast
        # Rain for the next 72 hours at every township centre plus a rule-of-thumb warning level.
        continue-on-error: true
        run: python scripts/fetch_rain_forecast.py

      - name: Commit data to the current branch
        if: ${{ env.DATA_BRANCH == '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update hazard layers $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 10))
          done
          echo "Could not push the data commit after 4 attempts." >&2
          exit 1

      - name: Publish data to the history-free data branch
        if: ${{ env.DATA_BRANCH != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -R data/. "$work/"
          cd "$work"
          git init -q -b "$DATA_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: update hazard layers $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$DATA_BRANCH"

      - name: Ask GitHub Pages to rebuild
        if: ${{ env.DATA_BRANCH == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Keep the scheduled workflow enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update_data.yml --repo "$GITHUB_REPOSITORY"

      - name: Fail the run if the pipeline failed
        if: ${{ steps.pipeline.outcome == 'failure' }}
        run: |
          echo "::error::The pipeline reported an error. See the 'Generate flood and landslide layers' step log."
          exit 1
